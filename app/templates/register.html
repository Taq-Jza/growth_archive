{% extends "base.html" %}
{% block title %}创建账号 · 成长档案{% endblock %}

{% block shell %}
<div class="relative grid min-h-screen w-full place-items-center overflow-hidden px-4">

  <div class="pointer-events-none absolute -left-32 -top-32 h-80 w-80 rounded-full opacity-40 blur-3xl"
       style="background:radial-gradient(circle,rgba(13,148,136,.5),transparent 70%)"></div>
  <div class="pointer-events-none absolute -bottom-40 -right-24 h-96 w-96 rounded-full opacity-40 blur-3xl"
       style="background:radial-gradient(circle,rgba(99,102,241,.32),transparent 70%)"></div>

  <div class="relative w-full max-w-sm py-10">
    <div class="mb-8 text-center fade-up">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-[14px] text-[15px] font-semibold text-white shadow-[0_8px_20px_-8px_rgba(13,148,136,.7)]"
           style="background:linear-gradient(145deg,var(--brand),var(--brand-deep))">G</div>
      <h1 class="mt-4 text-xl font-semibold tracking-tight">创建一个账号</h1>
      <p class="mt-1.5 text-[13px] text-[var(--ink-3)]">档案存在这台服务器上，只有你自己的账号能看到。</p>
    </div>

    {% if error %}
    <div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-3.5 py-2.5 text-sm text-red-700 fade-up">{{ error }}</div>
    {% endif %}

    <form method="post" action="/register" class="card p-6 reveal" data-anim="zoom" style="--d:.06s">
      <label class="block">
        <span class="text-xs text-[var(--ink-3)]">邮箱</span>
        <input name="email" type="email" required autocomplete="username" value="{{ email or '' }}"
               placeholder="you@example.com"
               class="mt-1.5 w-full rounded-[10px] bg-[rgba(26,29,25,.035)] px-3.5 py-2.5 text-[13.5px] outline-none transition-all duration-200 placeholder:text-[var(--ink-4)] focus:bg-white focus:shadow-[inset_0_0_0_1px_var(--brand-edge),0_0_0_4px_rgba(13,148,136,.09)]">
      </label>
      <label class="mt-3 block">
        <span class="text-xs text-[var(--ink-3)]">口令</span>
        <input name="password" type="password" required minlength="6" autocomplete="new-password"
               placeholder="至少 6 位"
               class="mt-1.5 w-full rounded-[10px] bg-[rgba(26,29,25,.035)] px-3.5 py-2.5 text-[13.5px] outline-none transition-all duration-200 placeholder:text-[var(--ink-4)] focus:bg-white focus:shadow-[inset_0_0_0_1px_var(--brand-edge),0_0_0_4px_rgba(13,148,136,.09)]">
      </label>
      <label class="mt-3 block">
        <span class="text-xs text-[var(--ink-3)]">再输一次</span>
        <input name="password2" type="password" required minlength="6" autocomplete="new-password"
               placeholder="确认口令"
               class="mt-1.5 w-full rounded-[10px] bg-[rgba(26,29,25,.035)] px-3.5 py-2.5 text-[13.5px] outline-none transition-all duration-200 placeholder:text-[var(--ink-4)] focus:bg-white focus:shadow-[inset_0_0_0_1px_var(--brand-edge),0_0_0_4px_rgba(13,148,136,.09)]">
      </label>
      <button class="btn btn-primary mt-5 w-full justify-center py-2.5">创建并进入</button>

      {# 没有找回口令的通道，就把后果说在前面，别等人注册完才问 #}
      <p class="mt-3 text-[11.5px] leading-relaxed text-[var(--ink-4)]">
        这个版本没有找回口令，忘了只能换个邮箱重建 —— 记牢一点。
      </p>
    </form>

    <div class="mt-4 flex flex-col items-center gap-2 text-center text-[13px] fade-up" style="--d:.12s">
      <a href="/login" class="text-[var(--ink-3)] transition-colors duration-200 hover:text-[var(--brand-deep)]">
        已有账号，去登录
      </a>
      <a href="/demo" class="group inline-flex items-center gap-1 text-[12.5px] text-[var(--ink-4)] transition-colors duration-200 hover:text-[var(--brand-deep)]">
        或者直接看体验账号
        <span class="arrow inline-block opacity-0 transition-opacity group-hover:opacity-100">→</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}

{% block content %}{% endblock %}
