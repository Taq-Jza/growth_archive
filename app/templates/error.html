{% extends "base.html" %}
{% block title %}{{ code }} · 成长档案{% endblock %}
{% block content %}
<div class="mx-auto max-w-md py-16 text-center">
  <div class="text-5xl font-medium tabular-nums text-[rgba(26,29,25,.14)]">{{ code }}</div>
  <h1 class="mt-4 text-lg font-medium">{{ title }}</h1>
  <p class="mt-2 text-sm leading-relaxed text-[var(--ink-3)]">{{ detail }}</p>
  <div class="mt-8 flex items-center justify-center gap-3">
    <a href="/" class="btn btn-primary">回到首页</a>
    <a href="javascript:history.back()" class="btn btn-ghost">返回上一页</a>
  </div>
</div>
{% endblock %}
