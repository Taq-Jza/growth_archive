{% extends "base.html" %}
{% block title %}登录 · 成长档案{% endblock %}

{% block shell %}
<div class="relative grid min-h-screen w-full place-items-center overflow-hidden px-4">

  <div class="pointer-events-none absolute -left-32 -top-32 h-80 w-80 rounded-full opacity-40 blur-3xl"
       style="background:radial-gradient(circle,rgba(13,148,136,.5),transparent 70%)"></div>
  <div class="pointer-events-none absolute -bottom-40 -right-24 h-96 w-96 rounded-full opacity-40 blur-3xl"
       style="background:radial-gradient(circle,rgba(99,102,241,.32),transparent 70%)"></div>

  <div class="relative w-full max-w-sm">
    <div class="mb-8 text-center fade-up">
      <div class="mx-auto flex h-12 w-12 items-center justify-center rounded-[14px] text-[15px] font-semibold text-white shadow-[0_8px_20px_-8px_rgba(13,148,136,.7)]"
           style="background:linear-gradient(145deg,var(--brand),var(--brand-deep))">G</div>
      <h1 class="mt-4 text-xl font-semibold tracking-tight">成长档案</h1>
      <p class="mt-1.5 text-[13px] text-[var(--ink-3)]">把散落的经历，变成能讲清楚的证据。</p>
    </div>

    {% if error %}
    <div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-3.5 py-2.5 text-sm text-red-700 fade-up">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="card p-6 reveal" data-anim="zoom" style="--d:.06s">
      <label class="block">
        <span class="text-xs text-[var(--ink-3)]">邮箱</span>
        <input name="email" type="email" required autocomplete="username"
               class="mt-1.5 w-full rounded-[10px] bg-[rgba(26,29,25,.035)] px-3.5 py-2.5 text-[13.5px] shadow-[inset_0_0_0_1px_rgba(26,29,25,.08)] outline-none transition-all duration-200 focus:bg-white focus:shadow-[inset_0_0_0_1px_var(--brand-edge),0_0_0_4px_rgba(13,148,136,.09)]">
      </label>
      <label class="mt-3 block">
        <span class="text-xs text-[var(--ink-3)]">口令</span>
        <input name="password" type="password" required autocomplete="current-password"
               class="mt-1.5 w-full rounded-[10px] bg-[rgba(26,29,25,.035)] px-3.5 py-2.5 text-[13.5px] shadow-[inset_0_0_0_1px_rgba(26,29,25,.08)] outline-none transition-all duration-200 focus:bg-white focus:shadow-[inset_0_0_0_1px_var(--brand-edge),0_0_0_4px_rgba(13,148,136,.09)]">
      </label>
      <button class="btn btn-primary mt-5 w-full justify-center py-2.5">登录</button>
    </form>

    <div class="mt-4 text-center fade-up" style="--d:.12s">
      <a href="/demo" class="group inline-flex items-center gap-1 text-sm text-[var(--ink-3)] transition-colors duration-200 hover:text-[var(--brand-deep)]">
        直接体验，不用注册
        <span class="arrow inline-block opacity-0 transition-opacity group-hover:opacity-100">→</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}

{% block content %}{% endblock %}
